services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=db;Database=CosmeticsShopDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: CosmeticsShop.Api
      Jwt__Audience: CosmeticsShop.Client
      OpenAI__ApiKey: ${OPENAI_KEY}